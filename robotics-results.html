<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Meta Tags -->
    <meta name="description" content="Your recommended robotic weld cell solution - Industrial robotics automation with proven ROI and performance improvements.">
    <meta name="keywords" content="robotic welding, weld cell, industrial automation, robotics, manufacturing">

    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Your Recommended Weld Cell Solution">
    <meta property="og:description" content="Industrial robotics automation with proven ROI and performance improvements.">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <title>Your Recommended Weld Cell Solution</title>
    <link rel="stylesheet" href="robotics-results.css">
</head>
<body>
    <!-- Decorative Red Curved Arrow -->
    <svg class="decorative-arrow" viewBox="0 0 300 400" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M-50 0 C 50 100, 150 150, 100 300 C 80 350, 60 380, 40 400"
              stroke="#d32f2f"
              stroke-width="8"
              stroke-linecap="round"
              fill="none"/>
        <path d="M20 370 L40 400 L70 380"
              stroke="#d32f2f"
              stroke-width="8"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"/>
    </svg>

    <main class="results-container">
        <!-- Header Section -->
        <header class="results-header">
            <h1 class="main-title">YOUR RECOMMENDED SOLUTION</h1>
        </header>

        <!-- Three Column Layout -->
        <div class="results-grid">
            <!-- Left Column - ROI Calculator -->
            <div class="column column-left">
                <div class="roi-box">
                    <h2 class="roi-title">ROI CALCULATOR</h2>
                    <div class="roi-content">
                        <div class="roi-metric">
                            <span class="roi-label">PAYBACK PERIOD:</span>
                            <span class="roi-value payback">12 MONTHS</span>
                        </div>
                        <hr class="roi-divider">
                        <div class="roi-metric">
                            <span class="roi-label">ESTIMATED ANNUAL SAVINGS</span>
                            <span class="roi-value savings">$50,000</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Middle Column - Pricing & Chart -->
            <div class="column column-middle">
                <div class="pricing-section">
                    <span class="availability-badge">AVAILABLE NOW</span>
                    <span class="price">$80,000</span>
                </div>

                <div class="chart-section">
                    <h3 class="chart-title">PERFORMANCE COMPARISON</h3>
                    <div class="bar-chart">
                        <div class="bar-container">
                            <div class="bar bar-manual">
                                <div class="bar-fill"></div>
                            </div>
                            <span class="bar-label">Manual</span>
                        </div>
                        <div class="bar-container">
                            <div class="bar bar-robotic">
                                <div class="bar-fill"></div>
                            </div>
                            <span class="bar-label">Robotic</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column - Robotic Welding Image -->
            <div class="column column-right">
                <div class="image-container">
                    <img src="https://images.unsplash.com/photo-1565043589221-1a6fd9ae45c7?w=600&h=500&fit=crop"
                         alt="Robotic welding arm in action with blue sparks"
                         class="welding-image"
                         loading="lazy">
                </div>
            </div>
        </div>
    </main>
</body>
</html>
